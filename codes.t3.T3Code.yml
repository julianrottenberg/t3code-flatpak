app-id: codes.t3.T3Code
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: run.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.secrets
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=home
  - --filesystem=/home/linuxbrew:ro
  - --filesystem=xdg-config/t3code:create
  - --env=PATH=/app/bin:/usr/bin:/home/julian/.npm-global/bin:/home/linuxbrew/.linuxbrew/bin
modules:
  - name: t3code
    buildsystem: simple
    build-commands:
      - chmod +x T3-Code.AppImage
      # This AppImage truncates on some hosts with --appimage-extract (missing t3code binary) — handle both paths.
      - |
        echo "Attempting --appimage-extract..."
        ./T3-Code.AppImage --appimage-extract 2>&1 | head -n 30 || true
        ls -lh squashfs-root/t3code 2>&1 | head -n 5 || true
        if [ ! -f squashfs-root/t3code ]; then
          echo "--appimage-extract incomplete, extracting SquashFS payload with 7z (offset 188392)..."
          if ! command -v 7z >/dev/null 2>&1; then
            echo "7z not found, installing p7zip..."
            apt-get update -qq 2>/dev/null && apt-get install -y -qq p7zip-full 2>/dev/null || dnf install -y p7zip 2>/dev/null || true
          fi
          rm -rf squashfs-root
          7z x -y T3-Code.AppImage -osquashfs-root 2>&1 | tail -n 30
          # 7z may leave payload at top-level if offset handling varies — normalize
          if [ ! -f squashfs-root/t3code ] && [ -f t3code ]; then
            mkdir -p squashfs-root
            for f in AppRun t3code t3code.desktop t3code.png chrome* lib* *.pak *.bin *.json .DirIcon resources locales usr snapshot_blob.bin resources.pak v8_context_snapshot.bin vk_swiftshader_icd.json; do
              [ -e "$f" ] && mv "$f" squashfs-root/ 2>/dev/null || true
            done
          fi
        fi
        ls -lh squashfs-root/t3code 2>&1 | head -n 5
        test -f squashfs-root/t3code
      - rm -f T3-Code.AppImage
      - desktop-file-edit --set-icon codes.t3.T3Code --set-key Exec --set-value 'run.sh
        %U' squashfs-root/t3code.desktop
      - install -D run.sh -t /app/bin
      - install -Dm644 codes.t3.T3Code.metainfo.xml -t /app/share/metainfo
      - install -Dm644 squashfs-root/t3code.desktop /app/share/applications/codes.t3.T3Code.desktop
      - install -Dm644 codes.t3.T3Code.png /app/share/icons/hicolor/512x512/apps/codes.t3.T3Code.png
      - mv squashfs-root /app/t3code
      # Install icons for all sizes for proper HiDPI lookup
      - |
        for size in 16 22 24 32 48 64 128 256 512; do
          if [ -f "/app/t3code/usr/share/icons/hicolor/${size}x${size}/apps/t3code.png" ]; then
            install -Dm644 "/app/t3code/usr/share/icons/hicolor/${size}x${size}/apps/t3code.png" \
              "/app/share/icons/hicolor/${size}x${size}/apps/codes.t3.T3Code.png"
          fi
        done
      - |
        # Host wrappers - expose host git/gh via flatpak-spawn (requires --talk-name=org.freedesktop.Flatpak)
        install -Dm755 /dev/stdin /app/bin/git <<'EOS'
        #!/bin/sh
        exec flatpak-spawn --host git "$@"
        EOS
        install -Dm755 /dev/stdin /app/bin/gh <<'EOS'
        #!/bin/sh
        exec flatpak-spawn --host /home/linuxbrew/.linuxbrew/bin/gh "$@"
        EOS
        install -Dm755 /dev/stdin /app/bin/opencode <<'EOS'
        #!/bin/sh
        exec flatpak-spawn --host /home/julian/.npm-global/bin/opencode "$@"
        EOS
        chmod +x /app/bin/git /app/bin/gh /app/bin/opencode
    sources:
      - type: file
        url: https://github.com/pingdotgg/t3code/releases/download/v0.0.44/T3-Code-0.0.44-x86_64.AppImage
        sha256: bab6cf29f13015af7e966e953e8ed5a9ad7b6e63cb864cf41e3e0815ea857219
        dest-filename: T3-Code.AppImage
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/pingdotgg/t3code/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="T3-Code-" + $version + "-x86_64.AppImage")
            | .browser_download_url
      - type: file
        path: codes.t3.T3Code.metainfo.xml
      - type: file
        path: codes.t3.T3Code.png
      - type: script
        dest-filename: run.sh
        commands:
          - zypak-wrapper.sh /app/t3code/t3code "$@"
