name: Build and Publish Flatpak

on:
  schedule:
    # Poll upstream for a new stable release. GitHub's `releases/latest`
    # endpoint never returns pre-releases or drafts, so nightly/preview
    # builds can't trigger this workflow.
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# One build at a time; never cancel a run mid-publish.
concurrency:
  group: t3code-flatpak-build
  cancel-in-progress: false

jobs:
  check:
    name: Check for New Stable Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      latest: ${{ steps.compare.outputs.latest }}
      pinned: ${{ steps.compare.outputs.pinned }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare upstream stable release with manifest pin
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          latest=$(gh api repos/pingdotgg/t3code/releases/latest --jq '.tag_name' 2>/dev/null | sed 's/^v//' || true)
          pinned=$(grep -oE 'T3-Code-[0-9]+\.[0-9]+\.[0-9]+-x86_64\.AppImage' codes.t3.T3Code.yml \
            | head -n1 | sed -E 's/^T3-Code-([0-9.]+)-x86_64\.AppImage$/\1/' || true)

          echo "Upstream latest stable: ${latest:-<unknown>}"
          echo "Manifest pinned:        ${pinned:-<unknown>}"

          changed=false
          if [ "$EVENT" != "schedule" ]; then
            # Push or manual dispatch: rebuild even when the pin is current.
            changed=true
          elif [ -z "$latest" ]; then
            echo "::warning::Could not read upstream releases/latest — skipping this poll."
          elif [ "$latest" != "$pinned" ]; then
            echo "::notice::New stable release $latest (pinned: ${pinned:-none}) — rebuilding."
            changed=true
          else
            echo "Already on the latest stable release — nothing to do."
          fi

          {
            echo "changed=$changed"
            echo "latest=$latest"
            echo "pinned=$pinned"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### T3 Code stable check"
            echo ""
            echo "| | Version |"
            echo "|---|---|"
            echo "| Upstream stable | \`${{ steps.compare.outputs.latest || 'unknown' }}\` |"
            echo "| Manifest pin | \`${{ steps.compare.outputs.pinned || 'unknown' }}\` |"
            echo "| Rebuild | \`${{ steps.compare.outputs.changed }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  update:
    name: Update Manifest
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run External Data Checker
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --commit-only codes.t3.T3Code.yml

      - name: Push changes
        if: github.event_name != 'pull_request'
        run: |
          git push origin HEAD:${{ github.ref_name }} || echo "No changes to push"

  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: [check, update]
    container:
      image: ghcr.io/andyholmes/flatter/freedesktop:25.08
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Flatpak dependencies
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08

      - name: Build
        uses: andyholmes/flatter@main
        with:
          files: codes.t3.T3Code.yml
          upload-pages-artifact: false

      - name: Sign repo with GPG
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "FLATPAK_GPG_KEY not set — building unsigned repo (add secret for signed builds)"
            flatpak build-update-repo repo
            exit 0
          fi
          export GNUPGHOME=/tmp/gnupg
          mkdir -p $GNUPGHOME
          chmod 700 $GNUPGHOME
          echo "$GPG_KEY" | gpg --batch --import
          KEYID=$(gpg --list-keys --with-colons | grep fpr | head -1 | cut -d: -f10)
          for ref in $(ostree refs --repo=repo); do
            ostree gpg-sign --repo=repo --gpg-homedir=$GNUPGHOME "$ref" $KEYID
          done
          flatpak build-update-repo --gpg-sign=$KEYID --gpg-homedir=$GNUPGHOME repo
          gpg --export --armor $KEYID > repo/t3code-flatpak.gpg
          GPGKEY_B64=$(gpg --export $KEYID | base64 -w0)
          printf '\nGPGKey=%s\n' "$GPGKEY_B64" >> repo/index.flatpakrepo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
